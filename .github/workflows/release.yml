name: Release

# Builds the Windows installer, the Fedora rpm (plus AppImage) and the macOS
# universal app (.dmg + .app.tar.gz) for every version tag (vX.Y.Z), signs the
# updater artifacts and publishes a GitHub release with latest.json, which the
# installed app polls for updates.
#
# Required repository secrets: TAURI_SIGNING_PRIVATE_KEY (content of the
# private key generated locally with `npx tauri signer generate`; it never
# lives in the repo) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (its password).
#
# macOS: there is no Apple Developer account yet, so the app is only ad-hoc
# signed (bundle.macOS.signingIdentity "-") and not notarized; users open it
# with right click -> Open the first time. To sign and notarize, add the
# secrets listed in the commented env block of the build step and uncomment
# it (APPLE_SIGNING_IDENTITY overrides the ad-hoc identity).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: rpm,appimage
          # One universal binary (Apple Silicon + Intel). tauri-action lists
          # it in latest.json as both darwin-aarch64 and darwin-x86_64.
          # Built on the Intel runner: GitHub's Apple Silicon runners often
          # have no capacity and the job is cancelled before it starts.
          - platform: macos-15-intel
            bundles: app,dmg
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev rpm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing and notarization (macOS job only), ready for when
          # there is an Apple Developer account. The bundler imports the
          # certificate into a temporary keychain by itself.
          #   APPLE_CERTIFICATE: base64 of the "Developer ID Application" .p12
          #   APPLE_CERTIFICATE_PASSWORD: password of that .p12
          #   APPLE_SIGNING_IDENTITY: "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID / APPLE_PASSWORD (app-specific password) / APPLE_TEAM_ID:
          #     notarization with the Apple ID
          # Uncomment once the secrets exist (on Windows/Linux they are ignored):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Velo Fedmor ${{ github.ref_name }}"
          releaseBody: "Vedi CHANGELOG.md. L'app installata si aggiorna da sola."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} ${{ matrix.args }}

  # Fail the run if a platform is missing from latest.json: installed apps
  # on that platform would silently stop updating.
  check-updater:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern latest.json
          jq -r '.platforms | keys[]' latest.json
          for p in windows-x86_64 linux-x86_64 darwin-aarch64 darwin-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].url' latest.json > /dev/null || { echo "::error::latest.json has no $p entry"; exit 1; }
          done
