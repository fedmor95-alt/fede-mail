<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb2ff"/>
      <stop offset="1" stop-color="#0a5cf5"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#002a80" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="196" y="300" width="632" height="440" rx="56" fill="url(#paper)"/>
  </g>
  <!-- lower folds -->
  <path d="M236 708 L430 530 M788 708 L594 530" stroke="#c9d9f7" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- top flap -->
  <path d="M240 340 L476 534 Q512 562 548 534 L784 340" stroke="#bcd0f5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
