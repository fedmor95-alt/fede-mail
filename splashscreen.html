<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velo Fedmor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #202020;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .logo {
      width: 180px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards;
    }

    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #60cdff;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- Velo Fedmor logo: the app icon plus the name, inline, no external files -->
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 431 97.455" fill="none">
    <rect x="0" y="0.7" width="96" height="96" rx="22" fill="#0067C0"/>
    <rect x="18.4" y="30" width="59.2" height="39" rx="6" fill="#ffffff"/>
    <path d="M21.7 34.1 L45.1 52.1 Q48 54.4 50.9 52.1 L74.3 34.1" stroke="#0067C0" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="118" y="66" fill="#e2e8f0" font-family="Segoe UI Variable Display, Segoe UI, system-ui, sans-serif" font-size="46" font-weight="600" letter-spacing="0.5">Velo Fedmor</text>
  </svg>

  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
